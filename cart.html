<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart | HLX Labs</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html"><img src="assets/logo.png"><span><b>HLX</b> LABS</span></a><nav><a href="index.html">HOME</a><a href="shop.html">SHOP</a><a href="coa.html">COAs</a><a href="contact.html">CONTACT</a><a href="account.html">ACCOUNT</a><a class="cart-pill" href="cart.html">CART (<span class="cart-count">0</span>)</a></nav></header><main class="section"><div class="eyebrow">YOUR ORDER</div><h2>Shopping Cart</h2><div class="cart-box" id="cartItems"></div><div class="cart-total">Subtotal: <span id="total">$0.00</span></div><div class="cart-checkout-actions"><button class="btn primary" id="hlxCheckoutButton" type="button" onclick="beginHLXTagadaCheckout()">PROCEED TO CHECKOUT</button><p id="checkoutNotice" role="status" aria-live="polite"></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js?v=20261021-12"></script><script src="https://cdn.jsdelivr.net/npm/@tagadapay/headless-sdk/dist/tagada-headless.min.js"></script><script src="tagada-checkout.js?v=20261021-8"></script><script>
(function(){
 function restoreCart(){
  var box=document.getElementById('cartItems'),total=document.getElementById('total');
  if(!box||!total)return;
  var items=[];
  try{
   var raw=localStorage.getItem('hlxCart')||sessionStorage.getItem('hlxCartBackup')||'[]';
   items=JSON.parse(raw);
   if(!Array.isArray(items))throw new Error('Invalid cart format');
  }catch(err){box.textContent='Unable to read saved cart items. Browser storage may be blocked.';console.error('Cart recovery:',err);return}
  if(!items.length){
   box.innerHTML='<p>Your cart is currently empty.</p><p style="opacity:.75;font-size:.9em">If you just added an item, make sure the Shop and Cart are both on hlxlabs.com (not www.hlxlabs.com or a preview domain), and use the Cart link from the Shop.</p>';
   total.textContent='$0.00';return;
  }
  // If the normal cart renderer worked, leave its interactive controls intact.
  if(box.querySelector('.cart-row'))return;
  box.innerHTML='';
  var sum=0;
  items.forEach(function(item,i){
   var qty=Math.max(1,Number(item.qty)||1),price=Number(item.price)||0;
   sum+=qty*price;
   var row=document.createElement('div');row.className='cart-row';
   var details=document.createElement('div'),name=document.createElement('strong');
   name.textContent=item.name||'Research product';details.appendChild(name);
   if(item.selectedOption){var opt=document.createElement('small');opt.className='cart-option';opt.textContent=item.selectedOption;details.appendChild(opt)}
   var controls=document.createElement('div');controls.className='qty';
   var minus=document.createElement('button');minus.type='button';minus.textContent='−';
   var count=document.createElement('span');count.textContent=qty;
   var plus=document.createElement('button');plus.type='button';plus.textContent='+';
   var priceEl=document.createElement('span');priceEl.textContent='
+(qty*price).toFixed(2);
   var remove=document.createElement('button');remove.type='button';remove.className='btn';remove.textContent='Remove';
   function change(delta){var updated=JSON.parse(localStorage.getItem('hlxCart')||'[]');if(!Array.isArray(updated)||!updated[i])return;updated[i].qty=(Number(updated[i].qty)||1)+delta;if(updated[i].qty<=0)updated.splice(i,1);localStorage.setItem('hlxCart',JSON.stringify(updated));sessionStorage.setItem('hlxCartBackup',JSON.stringify(updated));location.reload()}
   minus.onclick=function(){change(-1)};plus.onclick=function(){change(1)};remove.onclick=function(){change(-qty)};
   controls.append(minus,count,plus);row.append(details,controls,priceEl,remove);box.appendChild(row);
  });
  total.textContent='
+sum.toFixed(2);
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',restoreCart);
 else restoreCart();
})();
</script></body></html>
