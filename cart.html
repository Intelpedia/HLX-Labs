<!doctype html><html><head><script>
(function(){
  var page=(location.pathname.split('/').pop()||'index.html')+location.search;
  var hasSession=false;
  try{
    for(var i=0;i<localStorage.length;i++){
      var key=localStorage.key(i)||'';
      if(key.indexOf('sb-')===0 && key.endsWith('-auth-token')){
        var raw=localStorage.getItem(key), parsed=raw&&JSON.parse(raw);
        var token=parsed&&((parsed.access_token)||(parsed.currentSession&&parsed.currentSession.access_token));
        var expires=parsed&&((parsed.expires_at)||(parsed.currentSession&&parsed.currentSession.expires_at));
        if(token && (!expires || Number(expires)*1000>Date.now())){hasSession=true;break}
      }
    }
  }catch(e){}
  if(!hasSession){
    location.replace('account.html?next='+encodeURIComponent(page));
    document.write('<style>html{display:none!important}</style>');
  }
})();
</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart | HLX Labs</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html"><img src="assets/logo.png"><span><b>HLX</b> LABS</span></a><nav><a href="index.html">HOME</a><a href="shop.html">SHOP</a><a href="coa.html">COAs</a><a href="contact.html">CONTACT</a><a href="account.html">ACCOUNT</a><a class="cart-pill" href="cart.html">CART (<span class="cart-count">0</span>)</a></nav></header><main class="section"><div class="eyebrow">YOUR ORDER</div><h2>Shopping Cart</h2><div class="cart-box" id="cartItems"></div><div class="cart-total">Subtotal: <span id="total">$0.00</span></div><div class="cart-checkout-actions"><button class="btn primary" onclick="alert('Checkout will be connected to your payment processor. After the processor securely confirms payment, the customer will be sent to the Order Confirmation page.')">PROCEED TO CHECKOUT</button></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>
(function(){
 var protectedPages=new Set(['shop.html','coa.html','contact.html','cart.html','product.html','faq.html','shipping.html','order-confirmation.html']);
 function hasHLXSession(){try{for(var i=0;i<localStorage.length;i++){var key=localStorage.key(i)||'';if(key.indexOf('sb-')===0&&key.endsWith('-auth-token')){var p=JSON.parse(localStorage.getItem(key)||'null');var t=p&&((p.access_token)||(p.currentSession&&p.currentSession.access_token));var x=p&&((p.expires_at)||(p.currentSession&&p.currentSession.expires_at));if(t&&(!x||Number(x)*1000>Date.now()))return true}}}catch(e){}return false}
 document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href]');if(!a)return;var u;try{u=new URL(a.getAttribute('href'),location.href)}catch(err){return}if(u.origin!==location.origin)return;var page=(u.pathname.split('/').pop()||'index.html').toLowerCase();if(protectedPages.has(page)&&!hasHLXSession()){e.preventDefault();location.href='account.html?next='+encodeURIComponent(page+u.search)}},true);
})();
</script></body></html>
