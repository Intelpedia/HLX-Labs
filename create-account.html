<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | HLX Labs</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html"><img src="assets/logo.png"><span><b>HLX</b> LABS</span></a><nav><a href="index.html">HOME</a><a href="shop.html">SHOP</a><a href="coa.html">COAs</a><a href="contact.html">CONTACT</a><a href="account.html">ACCOUNT</a><a class="cart-pill" href="cart.html">CART (<span class="cart-count">0</span>)</a></nav></header><main class="section auth-page gateway-page"><section class="gateway-shell"><div class="gateway-brand"><img src="assets/logo.png" alt="HLX Labs"><div><span>RESTRICTED RESEARCH ACCESS</span><strong>HLX LABS</strong></div></div><div class="eyebrow">NEW CUSTOMER</div><h2>Create an account</h2><div class="account-grid single"><form id="createAccountForm" class="auth-card researcher-gateway"><h3>Researcher Access</h3><p class="gateway-intro">Complete all required fields and confirmations to request access to the HLX Labs research catalog.</p><div class="field"><label for="createName">Name</label><input id="createName" name="name" type="text" autocomplete="name" required></div><div class="field"><label for="createEmail">Email</label><input id="createEmail" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="researcherType">What type of researcher are you?</label><select id="researcherType" name="researcherType" required><option value="" selected disabled>Select researcher type</option><option>Independent / Private Laboratory Researcher</option><option>Academic / University Researcher</option><option>Biotech / Pharmaceutical Professional</option><option>Contract Research Organization (CRO)</option></select></div><div class="field"><label for="createPassword">Password</label><input id="createPassword" name="password" type="password" autocomplete="new-password" minlength="8" required></div><div class="field"><label for="createPasswordConfirm">Confirm Password</label><input id="createPasswordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" minlength="8" required></div><div class="researcher-confirmations"><label class="gateway-check"><input type="checkbox" name="ageConfirmed" required><span>I confirm I am at least 21 years of age.</span></label><label class="gateway-check"><input type="checkbox" name="researchUseConfirmed" required><span>I confirm I am a qualified researcher purchasing for in vitro / laboratory research only - NOT FOR HUMAN OR VETERINARY USE.</span></label><label class="gateway-check"><input type="checkbox" name="termsAccepted" required><span>I have read and accept the <a href="terms.html" target="_blank" rel="noopener">Terms of Sale</a> and <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.</span></label></div><div class="gateway-buttons"><button class="btn primary" type="submit">CREATE ACCOUNT</button><a class="btn gateway-leave" href="index.html">LEAVE - I DO NOT QUALIFY</a></div><p class="account-link">Already have an account? <a href="account.html">Sign in</a></p></form></div><p id="authMsg" class="notice" aria-live="polite"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>
(function(){
  var protectedPages=new Set(['shop.html','coa.html','contact.html','cart.html','product.html','faq.html','shipping.html','order-confirmation.html']);
  function hasHLXSession(){
    try{
      for(var i=0;i<localStorage.length;i++){
        var key=localStorage.key(i)||'';
        if(key.indexOf('sb-')===0 && key.endsWith('-auth-token')){
          var parsed=JSON.parse(localStorage.getItem(key)||'null');
          var token=parsed&&((parsed.access_token)||(parsed.currentSession&&parsed.currentSession.access_token));
          var expires=parsed&&((parsed.expires_at)||(parsed.currentSession&&parsed.currentSession.expires_at));
          if(token&&(!expires||Number(expires)*1000>Date.now()))return true;
        }
      }
    }catch(e){}
    return false;
  }
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href]');if(!a)return;
    var url;try{url=new URL(a.getAttribute('href'),location.href)}catch(err){return}
    if(url.origin!==location.origin)return;
    var page=(url.pathname.split('/').pop()||'index.html').toLowerCase();
    if(protectedPages.has(page)&&!hasHLXSession()){
      e.preventDefault();
      location.href='account.html?next='+encodeURIComponent(page+url.search);
    }
  },true);
})();
</script></body></html>
